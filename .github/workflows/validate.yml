name: validate

on:
  push:
    paths: ['**.sh', 'setup/**', '.github/workflows/validate.yml']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # weekly: catch pairing/validation drift early
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: bash -n (parse every script)
        run: |
          set -e
          while IFS= read -r -d '' f; do
            echo "::  bash -n $f"
            bash -n "$f"
          done < <(find . -name '*.sh' -type f -print0)
      - name: shellcheck
        run: |
          set -e
          while IFS= read -r -d '' f; do
            shellcheck -x --severity=style "$f"
          done < <(find setup -name '*.sh' -type f -print0)
      - name: lint the workflow's own run blocks (extracted, whole-script checks)
        run: |
          set -e
          python3 -m pip install --quiet pyyaml 2>/dev/null || sudo apt-get -y install -q python3-yaml
          rm -rf /tmp/runblocks
          python3 setup/tools/extract-run-scripts.py .github/workflows/validate.yml /tmp/runblocks
          status=0
          for f in /tmp/runblocks/*.sh; do
            bash -n "$f" || status=1
            shellcheck -x --severity=warning "$f" || status=1
          done
          exit "$status"

  data:
    name: compatibility data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pairings JSON
        run: python3 setup/lib/json_query.py validate
      - name: --list renders
        run: ./setup/create-vm.sh --list

  arch-packages:
    name: Arch/Omarchy package names resolve
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: pacman resolves every package setup.sh installs on Arch
        run: |
          pacman -Sy --noconfirm >/dev/null
          # shellcheck disable=SC1091
          . setup/lib/packages.sh
          pacman -Sp --print-format '%n' "${ARCH_PKGS[@]}" linux-headers > /dev/null
          echo "ok: ${#ARCH_PKGS[@]} packages resolve"
      - name: lzfse is still in the AUR
        run: |
          curl -fsS 'https://aur.archlinux.org/rpc/v5/info?arg[]=lzfse' | grep -q '"resultcount":1'

  smoke:
    name: dry-run pipelines
    runs-on: ubuntu-latest
    needs: [lint, data]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: 'iPhone17,3', ios: '26.6.2' }   # the Linux-tested reference
          - { device: 'iPhone17,3', ios: '27.0.1' }
          - { device: 'iPhone18,2', ios: '27.0.1' }
          - { device: 'iPhone19,4', ios: '27.1' }     # the Duo: under test on Linux
          - { device: 'iPad16,1',   ios: '26.6.2' }
    env:
      # Every dry-run assertion lives here: no VM manages to start, nothing
      # touches the network, and no command executes.
      VSETUP_SRC: /tmp/vset-src
      VSETUP_RELEASE: /tmp/vset-release
      VSETUP_DEVICES: /tmp/vset-devices
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run full pipeline for ${{ matrix.device }} ${{ matrix.ios }}
        run: |
          mkdir -p "$VSETUP_SRC" "$VSETUP_RELEASE" "$VSETUP_DEVICES"
          ./setup/create-vm.sh --dry-run -y \
            --device '${{ matrix.device }}' --ios '${{ matrix.ios }}' \
            --name ci-${{ matrix.device }}-${{ matrix.ios }} > out.log 2>&1 || true
          cat out.log
          test "$(grep -c 'dry-run' out.log)" -ge 5

      - name: Assert the dry-run never started (nor killed) any QEMU/vm
        run: |
          if pgrep -x qemu-system-aar; then
            echo 'FAIL: a QEMU process is running after the dry run'; pgrep -ax qemu-system-aar; exit 1
          fi
          # no process-kill logic at all in setup scripts (a never-fight-others rule)
          if grep -nE '(^|[^[:alnum:]_])(pkill|killall|fuser -k|kill(-9| )?[[:space:]])' \
              setup/setup.sh setup/create-vm.sh setup/lib/common.sh 2>/dev/null; then
            echo 'FAIL: kill commands are not allowed in setup scripts'; exit 1
          fi

  no-apple-content:
    name: no Apple code or firmware in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject any committed Apple firmware, image or guest binary
        run: |
          set -e
          bad=0
          # tracked files whose names look like Apple software or guest state
          bad_name() {
            local p
            for p in "$@"; do
              if git ls-files | grep -iqE "$p"; then
                git ls-files | grep -iE "$p"
                bad=1
              fi
            done
            return 0  # set -e: non-matching greps are expected, not fatal
          }
          bad_name '\.ipsw$' '\.im4p$' '\.img4$' '\.img$' '\.dmg$' \
            'guest-resources' 'AppleParavirt' '\.dylib$' 'AVP(Booter|SEPBooter)' \
            'Disk\.img$' 'nvram\.bin$' 'SEPStorage$' '(^|/)ecid$' 'serial$' || true
          # large binary blobs: sources + scripts are tiny; over 16 MiB tracked is
          # suspicious. Submodule commits (submodule entries) have no blob of their
          # own and are skipped.
          while IFS=' ' read -r otype f; do
            [ "$otype" = blob ] || continue
            sz=$(git cat-file -s "HEAD:$f")
            if [ "$sz" -gt 16777216 ]; then
              echo "FAIL: $f is $(numfmt --to=iec "$sz")"
              bad=1
            fi
          done < <(git ls-tree -r --format='%(objecttype) %(path)' HEAD)
          if [ "$bad" = 0 ]; then
            echo 'ok: no Apple software or large blobs tracked'
          else
            echo 'FAIL: remove the files above — Apple code/firmware is downloaded'
            echo '      from the CDN at run time, never committed.'
            exit 1
          fi

  e2e:
    name: end-to-end local harness (full dry run)
    runs-on: ubuntu-latest
    needs: [lint, data]
    steps:
      - uses: actions/checkout@v4
      - name: Install the suite's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq git python3-yaml curl unzip
      - name: Run test/smoke.sh (everything, one shot)
        env:
          # a clean isolated work area; no network needed, nothing boots
          VSETUP_SRC: /tmp/e2e-src
          VSETUP_RELEASE: /tmp/e2e-release
          VSETUP_DEVICES: /tmp/e2e-devices
        run: |
          bash setup/test/smoke.sh             # no built tools: the firmware step must degrade cleanly
          # The built-tools path is exercised on dev machines, where linux-create
          # has been built under $VSETUP_SRC — run the suite again against it:
          if [ -x "$PWD/linux-create/.build/out/out/Products/Debug-linux-x86_64/vphone-cli" ]; then
            VSETUP_SRC=$PWD VSETUP_RELEASE=$PWD VSETUP_DEVICES=/tmp/e2e-devices2 \
              bash setup/test/smoke.sh
          fi

  compat-sync:
    name: report upstream pairing drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq
      - name: Diff tested pairings vs upstream compatibility.md (report-only)
        continue-on-error: true
        run: |
          curl -sL https://raw.githubusercontent.com/Lakr233/vphone-cli/main/Documents/Guides/compatibility.md -o up.md
          # pairs mentioned upstream but missing here, as a diff summary:
          grep -oE '`[0-9A-Za-z,]+_[0-9]+\.[0-9]+(\.[0-9]+)?b?_[0-9A-Za-z]+`' up.md | sort -u > up.txt
          jq -r '.pairings[] | select(.unsupported!=true) | .ipsw' setup/data/compatibility.json \
            | sort -u | sed 's/`//g' > mine.txt
          echo 'Pairings recorded upstream but not in data/ (informational):'
          comm -23 up.txt mine.txt || true
