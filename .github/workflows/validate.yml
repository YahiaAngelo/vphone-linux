name: validate

on:
  push:
    paths: ['**.sh', 'setup/**', 'tools/**', 'linux-create/**', 'run-vphone.sh', '**.py', 'tools/window/**', 'tests/sshramdisk-bootstrap/**', '.github/workflows/validate.yml']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # weekly: catch pairing/validation drift early
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftly-private-prefix:
    name: private Swiftly installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned, signed Swiftly binary
        shell: bash
        run: |
          set -euo pipefail
          task_root="$RUNNER_TEMP/swiftly-1.2.0"
          gpg_home="$RUNNER_TEMP/swiftly-gnupg"
          mkdir -p "$task_root" "$gpg_home"
          chmod 700 "$gpg_home"
          archive="$task_root/swiftly-1.2.0-x86_64.tar.gz"
          signature="$archive.sig"
          curl -fsSL --retry 3 -o "$archive" \
            https://download.swift.org/swiftly/linux/swiftly-1.2.0-x86_64.tar.gz
          curl -fsSL --retry 3 -o "$signature" \
            https://download.swift.org/swiftly/linux/swiftly-1.2.0-x86_64.tar.gz.sig
          curl --compressed -fsSL --retry 3 -o "$task_root/swift.org-keys.asc" \
            https://www.swift.org/keys/all-keys.asc
          printf '%s  %s\n' \
            0b26b568811404374c7d7f07276b6aad4145db5d1893a45f307de6a94ca8d9c3 "$archive" \
            | sha256sum --check --status
          GNUPGHOME="$gpg_home" gpg --batch --import "$task_root/swift.org-keys.asc"
          verification=$(GNUPGHOME="$gpg_home" gpg --batch --status-fd 1 \
            --verify "$signature" "$archive" 2>&1)
          grep -Fq '[GNUPG:] VALIDSIG E813C892820A6FA13755B268F167DF1ACF9CE069' \
            <<<"$verification"
          tar -xzf "$archive" -C "$task_root" swiftly
          bash setup/test/swiftly-private-prefix.sh "$task_root/swiftly"

  cfw-connection:
    name: CFW connection construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install local transport test dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev openssh-client
      - name: Compile and check literal connection arguments
        run: |
          swiftc --version
          uv run --python 3.12 linux-create/tests/test_guest_connection.py
          uv run --python 3.12 linux-create/tests/test_ssh_wrappers.py

  lint:
    name: shellcheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH ramdisk ECID and signed-artifact regressions
        run: |
          bash tests/test-sshramdisk-bootstrap.sh
          python3 -m unittest discover -s tests -p 'test_sshramdisk_bootstrap.py' -v
      - name: CLI source ref selection and checkout preservation
        run: bash setup/test/cli-source-ref.sh
      - name: Explicit ECID selection regressions
        run: python3 -m unittest discover -s tests -p 'test_usbmux_connect.py' -v
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: USB/IP framing and timeout regressions
        run: python3 tools/test_vusb_usbip.py
      - name: bash -n (parse every script)
        run: |
          set -e
          while IFS= read -r -d '' f; do
            echo "::  bash -n $f"
            bash -n "$f"
          done < <(find . -name '*.sh' -type f -print0)
      - name: shellcheck
        run: |
          set -e
          while IFS= read -r -d '' f; do
            shellcheck -x --severity=style "$f"
          done < <(find setup -name '*.sh' -type f -print0)
      - name: lint the workflow's own run blocks (extracted, whole-script checks)
        run: |
          set -e
          python3 -m pip install --quiet pyyaml 2>/dev/null || sudo apt-get -y install -q python3-yaml
          rm -rf /tmp/runblocks
          python3 setup/tools/extract-run-scripts.py .github/workflows/validate.yml /tmp/runblocks
          status=0
          for f in /tmp/runblocks/*.sh; do
            bash -n "$f" || status=1
            shellcheck -x --severity=warning "$f" || status=1
          done
          exit "$status"
      - name: Window VSOCK portability tests
        run: python3 -m unittest discover -s tools/window -p 'test_vsock.py' -v

  data:
    name: compatibility data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pairings JSON
        run: python3 setup/lib/json_query.py validate
      - name: --list renders
        run: ./setup/create-vm.sh --list

  window-controls:
    name: window controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise window controls with mocked RPC
        run: python3 -m unittest discover -s tools/window -p 'test_*.py' -v

  packages:
    name: package names resolve (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'fedora:43',        family: fedora }
          - { image: 'fedora:44',        family: fedora }
          - { image: 'debian:13',        family: debian }
          - { image: 'ubuntu:25.10',     family: debian }
          - { image: 'ubuntu:26.04',     family: debian }
          - { image: 'archlinux:latest', family: arch }
    steps:
      - uses: actions/checkout@v4
      # One unknown name makes dnf/apt install nothing at all: resolve every name setup.sh asks
      # for, installing nothing (dnf --assumeno, apt-get --simulate, pacman -Sp).
      - name: every package setup.sh installs resolves
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
          IMAGE: ${{ matrix.image }}
        run: |
          # shellcheck disable=SC1091
          . setup/lib/packages.sh
          case $FAMILY in
            fedora)
              dnf -q makecache >/dev/null
              out=$(dnf install --assumeno "${FEDORA_PKGS[@]}" kernel-devel 2>&1 || true)
              if grep -iE 'No match for argument|Unable to find a match' <<<"$out"; then exit 1; fi ;;
            debian)
              apt-get update -qq >/dev/null
              missing=()
              for p in "${DEBIAN_PKGS[@]}"; do [ -n "$(apt-cache madison "$p")" ] || missing+=("$p"); done
              if [ ${#missing[@]} -gt 0 ]; then echo "missing: ${missing[*]}"; exit 1; fi
              x=linux-tools-generic; [ -n "$(apt-cache madison usbip)" ] && x=usbip
              apt-get install --simulate -qq "${DEBIAN_PKGS[@]}" "$x" linux-headers-generic >/dev/null ;;
            arch)
              pacman -Sy --noconfirm >/dev/null
              pacman -Sp --print-format '%n' "${ARCH_PKGS[@]}" linux-headers >/dev/null
              curl -fsS 'https://aur.archlinux.org/rpc/v5/info?arg[]=lzfse' | grep -q '"resultcount":1' ;;
          esac
          echo "ok: every package resolves on $IMAGE"

  smoke:
    name: dry-run pipelines
    runs-on: ubuntu-latest
    needs: [lint, data]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: 'iPhone17,3', ios: '26.6.2' }   # the Linux-tested reference
          - { device: 'iPhone17,3', ios: '27.0.1' }
          - { device: 'iPhone18,2', ios: '27.0.1' }
          - { device: 'iPhone19,4', ios: '27.1' }     # the Duo: under test on Linux
          - { device: 'iPad16,1',   ios: '26.6.2' }
    env:
      # Every dry-run assertion lives here: no VM manages to start, nothing
      # touches the network, and no command executes.
      VSETUP_SRC: /tmp/vset-src
      VSETUP_RELEASE: /tmp/vset-release
      VSETUP_DEVICES: /tmp/vset-devices
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run full pipeline for ${{ matrix.device }} ${{ matrix.ios }}
        run: |
          mkdir -p "$VSETUP_SRC" "$VSETUP_RELEASE" "$VSETUP_DEVICES"
          ./setup/create-vm.sh --dry-run -y \
            --device '${{ matrix.device }}' --ios '${{ matrix.ios }}' \
            --name ci-${{ matrix.device }}-${{ matrix.ios }} > out.log 2>&1 || true
          cat out.log
          test "$(grep -c 'dry-run' out.log)" -ge 5

      - name: Assert the dry-run never started (nor killed) any QEMU/vm
        run: |
          if pgrep -x qemu-system-aar; then
            echo 'FAIL: a QEMU process is running after the dry run'; pgrep -ax qemu-system-aar; exit 1
          fi
          # no process-kill logic at all in setup scripts (a never-fight-others rule)
          if grep -nE '(^|[^[:alnum:]_])(pkill|killall|fuser -k|kill(-9| )?[[:space:]])' \
              setup/setup.sh setup/create-vm.sh setup/lib/common.sh 2>/dev/null; then
            echo 'FAIL: kill commands are not allowed in setup scripts'; exit 1
          fi

  no-apple-content:
    name: no Apple code or firmware in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject any committed Apple firmware, image or guest binary
        run: |
          set -e
          bad=0
          # tracked files whose names look like Apple software or guest state
          bad_name() {
            local p
            for p in "$@"; do
              if git ls-files | grep -iqE "$p"; then
                git ls-files | grep -iE "$p"
                bad=1
              fi
            done
            return 0  # set -e: non-matching greps are expected, not fatal
          }
          bad_name '\.ipsw$' '\.im4p$' '\.img4$' '\.img$' '\.dmg$' \
            'guest-resources' 'AppleParavirt' '\.dylib$' 'AVP(Booter|SEPBooter)' \
            'Disk\.img$' 'nvram\.bin$' 'SEPStorage$' '(^|/)ecid$' 'serial$' || true
          # large binary blobs: sources + scripts are tiny; over 16 MiB tracked is
          # suspicious. Submodule commits (submodule entries) have no blob of their
          # own and are skipped.
          while IFS=' ' read -r otype f; do
            [ "$otype" = blob ] || continue
            sz=$(git cat-file -s "HEAD:$f")
            if [ "$sz" -gt 16777216 ]; then
              echo "FAIL: $f is $(numfmt --to=iec "$sz")"
              bad=1
            fi
          done < <(git ls-tree -r --format='%(objecttype) %(path)' HEAD)
          if [ "$bad" = 0 ]; then
            echo 'ok: no Apple software or large blobs tracked'
          else
            echo 'FAIL: remove the files above — Apple code/firmware is downloaded'
            echo '      from the CDN at run time, never committed.'
            exit 1
          fi

  e2e:
    name: end-to-end local harness (full dry run)
    runs-on: ubuntu-latest
    needs: [lint, data]
    steps:
      - uses: actions/checkout@v4
      - name: First-boot QMP launcher regression (no VM)
        run: bash setup/test/first-boot-qmp.sh
      - name: Install the suite's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq git python3-yaml curl unzip zip
      - name: Run test/smoke.sh (everything, one shot)
        env:
          # a clean isolated work area; no network needed, nothing boots
          VSETUP_SRC: /tmp/e2e-src
          VSETUP_RELEASE: /tmp/e2e-release
          VSETUP_DEVICES: /tmp/e2e-devices
        run: |
          bash setup/test/smoke.sh             # no built tools: the firmware step must degrade cleanly
          # The built-tools path is exercised on dev machines, where linux-create
          # has been built under $VSETUP_SRC — run the suite again against it:
          if [ -x "$PWD/linux-create/.build/out/out/Products/Release-linux-$(uname -m)/vphone-cli" ]; then
            VSETUP_SRC=$PWD VSETUP_RELEASE=$PWD VSETUP_DEVICES=/tmp/e2e-devices2 \
              bash setup/test/smoke.sh
          fi

  compat-sync:
    name: report upstream pairing drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq
      - name: Diff tested pairings vs upstream compatibility.md (report-only)
        continue-on-error: true
        run: |
          curl -sL https://raw.githubusercontent.com/Lakr233/vphone-cli/main/Documents/Guides/compatibility.md -o up.md
          # pairs mentioned upstream but missing here, as a diff summary:
          grep -oE '`[0-9A-Za-z,]+_[0-9]+\.[0-9]+(\.[0-9]+)?b?_[0-9A-Za-z]+`' up.md | sort -u > up.txt
          jq -r '.pairings[] | select(.unsupported!=true) | .ipsw' setup/data/compatibility.json \
            | sort -u | sed 's/`//g' > mine.txt
          echo 'Pairings recorded upstream but not in data/ (informational):'
          comm -23 up.txt mine.txt || true
